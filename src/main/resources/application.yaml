spring:
  config:
    import: optional:classpath:application-secret.yaml
  application:
    name: Agent-Assistant
  data:
    mongodb:
      uri: mongodb://localhost:27017/agent

  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://192.168.150.101:5432/ai_rag
    username: ${pg.username:root}
    password: ${pg.password:root}

  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB

server:
  port: 8080
  servlet:
    context-path: /api

rag:
  pgvector:
    table: rag_embedding
    # 维度必须与嵌入模型输出一致（如 text-embedding-v4 常见为 1024）
    dimension: 1024
    use-index: true
    index-list-size: 100
    create-table: true
    drop-table-first: false
    init-extension: true
  bootstrap:
    # 启动时仅在向量表为空时执行一次文档入库
    enabled: true
    docs-path: src/main/resources/docs
  retriever:
    max-results: 8
    min-score: 0.60

logging:
  level:
    root: info

multimodal:
  api:
    # OpenAI 兼容服务地址和鉴权
    base-url: ${MULTIMODAL_API_BASE_URL:https://api.deepseek.com}
    api-key: ${MULTIMODAL_API_KEY:${DEEP_SEEK_API_KEY:}}
    # 用于图片/文档理解的多模态模型（按你的AI服务商模型名配置）
    chat-model: ${MULTIMODAL_CHAT_MODEL:deepseek-chat}
    # 用于语音转文字的模型（如 whisper-1）
    audio-model: ${MULTIMODAL_AUDIO_MODEL:whisper-1}

langchain4j:
  community:
    dashscope:
      chat-model:
        model-name: qwen-max
        api-key: ${aliyun.api-key}
      streaming-chat-model:
        model-name: qwen-max
        api-key: ${aliyun.api-key}
      embedding-model:
        model-name: text-embedding-v4
        api-key: ${aliyun.api-key}
  open-ai:
    chat-model:
      base-url: https://api.deepseek.com
      api-key: ${DEEP_SEEK_API_KEY}
      model-name: deepseek-chat
      temperature: 0.7
      log-requests: true
      log-responses: true
    streaming-chat-model:
      base-url: https://api.deepseek.com
      api-key: ${DEEP_SEEK_API_KEY}
      model-name: deepseek-chat
      temperature: 0.7
      log-requests: true
      log-responses: true
    embedding-model:
      base-url: https://api.deepseek.com
      api-key: ${DEEP_SEEK_API_KEY}
      model-name: deepseek-embedding
      log-requests: true
      log-responses: true
      dimensions: 1024
  mcp:
    servers:
      aliyun-maps: # 自定义名称
        type: sse
        url: https://dashscope.aliyuncs.com/api/v1/mcps/amap-maps/mcp # 你复制的SSE
        timeout: 10000 # 可选，单位毫秒
        headers:
          Authorization: Bearer ${aliyun.api-key} # 百炼 API Key
#      aliyun-websearch: # 可加多个MCP
#        type: sse
#        url: https://api.modelscope.cn/mcp/servers/@modelscope/websearch
#        headers:
#          Authorization: Bearer ${ALIYUN_MCP_API_KEY}
